[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-research-engine"
version = "0.1.0"
description = "多源行情/基本面研究数据湖：统一 schema、原生 adapter、供因子与回测使用"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "alpha-research-engine" }]
dependencies = [
  "httpx>=0.27",
  "websockets>=12.0",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "pyarrow>=15.0",
  "aiosqlite>=0.20",
  "duckdb>=1.0",
  "tenacity>=8.2",
  "python-dotenv>=1.0",
  "pandas>=2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
]
research = [
  "jupyterlab>=4.0",
  "matplotlib>=3.8",
]

[project.scripts]
alpha = "alpha.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
