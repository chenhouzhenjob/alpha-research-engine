[project]
name = "alpha-datasources"
version = "0.1.0"
description = "外部数据源接入，按优先级降级使用（本期仅 GeckoTerminal 一个来源）"
requires-python = ">=3.11"
dependencies = ["alpha-core", "requests>=2.32", "tenacity>=9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_datasources"]

[tool.uv.sources]
alpha-core = { workspace = true }
