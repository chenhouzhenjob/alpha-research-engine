[project]
name = "alpha-datasources"
version = "0.1.0"
description = "外部数据源接入：GeckoTerminal（当前行情/OHLCV）、CoinGecko（代币现货价）、PancakeSwap Subgraph（历史 TVL/volume）"
requires-python = ">=3.11"
dependencies = ["alpha-core", "requests>=2.32", "tenacity>=9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_datasources"]

[tool.uv.sources]
alpha-core = { workspace = true }
