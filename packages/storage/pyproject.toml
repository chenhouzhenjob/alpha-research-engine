[project]
name = "alpha-storage"
version = "0.1.0"
description = "唯一直接访问数据库的地方：ORM 模型、迁移、仓储"
requires-python = ">=3.11"
dependencies = [
  "alpha-core",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_storage"]

[tool.uv.sources]
alpha-core = { workspace = true }
