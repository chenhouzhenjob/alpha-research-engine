[project]
name = "alpha-chains"
version = "0.1.0"
description = "链适配器：封装不同链的 RPC 调用差异，提供统一的 get_logs/get_block 接口"
requires-python = ">=3.11"
dependencies = ["alpha-core", "web3>=7.0", "tenacity>=9.0", "requests>=2.31"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_chains"]

[tool.uv.sources]
alpha-core = { workspace = true }
