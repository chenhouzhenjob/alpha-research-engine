# FRED 宏观序列（密钥在仓库根目录 .env：FRED_API_KEY）
venue: fred
market_type: macro
rest_base: https://api.stlouisfed.org/fred
# series_id → 频率与单位（供 canonical 标注；可按需增删）
# 系列说明见 https://fred.stlouisfed.org/series/{SERIES_ID}
series:
  # 名义 GDP（当期美元，未剔除通胀）
  GDP:
    frequency: quarterly
    unit: billions_usd
  # 实际 GDP（2017 链式美元，剔除通胀后可比）
  GDPC1:
    frequency: quarterly
    unit: billions_chained_2017_usd
  # CPI 全体城市消费者（季节调整），通胀常用指标
  CPIAUCSL:
    frequency: monthly
    unit: index_1982_84_100
  # 核心 CPI（剔除食品与能源，季节调整）
  CPILFESL:
    frequency: monthly
    unit: index_1982_84_100
  # 失业率（季节调整）
  UNRATE:
    frequency: monthly
    unit: percent
  # 非农就业人数（季节调整，千人）
  PAYEMS:
    frequency: monthly
    unit: thousands_of_persons
  # 联邦基金有效利率（货币政策松紧）
  FEDFUNDS:
    frequency: monthly
    unit: percent
  # 10 年期国债收益率
  DGS10:
    frequency: daily
    unit: percent
  # 10Y−2Y 国债期限利差（衰退预警常用）
  T10Y2Y:
    frequency: daily
    unit: percent
