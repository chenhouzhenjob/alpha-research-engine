[project]
name = "live-signal"
version = "0.1.0"
description = "实时研究驱动决策系统 · 阶段 0：只读结论 HTTP 服务，GET /conclusion"
requires-python = ">=3.11"
dependencies = [
  "alpha-core",
  "alpha-chains",
  "alpha-protocols",
  "alpha-datasources",
  "alpha-storage",
  "alpha-metrics",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
]

[project.scripts]
live-signal-serve = "live_signal.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/live_signal"]

[tool.uv.sources]
alpha-core = { workspace = true }
alpha-chains = { workspace = true }
alpha-protocols = { workspace = true }
alpha-datasources = { workspace = true }
alpha-storage = { workspace = true }
alpha-metrics = { workspace = true }
