[project]
name = "lp-backtest"
version = "0.1.0"
description = "LP 池发现指标回归系统：1a 候选池发现 + 历史数据接入"
requires-python = ">=3.11"
dependencies = [
  "alpha-core",
  "alpha-chains",
  "alpha-protocols",
  "alpha-datasources",
  "alpha-storage",
  "click>=8.1",
  "python-dotenv>=1.0",
]

[project.scripts]
lp-backtest-discover = "lp_backtest.discover:main"
lp-backtest-ingest = "lp_backtest.ingest:main"
lp-backtest-seed-whitelist = "lp_backtest.seed_whitelist:main"
lp-backtest-metrics = "lp_backtest.metrics:main"
lp-backtest-validate-il-model = "lp_backtest.validate.il_model:main"
lp-backtest-validate-range-backtest = "lp_backtest.validate.range_backtest:main"
lp-backtest-calibrate-weights = "lp_backtest.calibrate.weights:main"
lp-backtest-export-config = "lp_backtest.config_export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lp_backtest"]

[tool.uv.sources]
alpha-core = { workspace = true }
alpha-chains = { workspace = true }
alpha-protocols = { workspace = true }
alpha-datasources = { workspace = true }
alpha-storage = { workspace = true }
