# 不另起 Postgres。复用 products/alpha-lp/infra 已启动的实例（127.0.0.1:5432），
# 只在该实例上创建 alpha_research 库（已存在则跳过）。
#
# 先在 LP 目录执行：
#   docker compose -f infra/docker-compose.yml up -d
# 再在本目录执行：
#   docker compose up
services:
  ensure-research-db:
    image: postgres:16-alpine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PGHOST: host.docker.internal
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    entrypoint: ["sh", "-c"]
    command:
      - |
        until pg_isready; do sleep 1; done
        psql -d postgres -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_database WHERE datname = 'alpha_research'" | grep -q 1 \
          || psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE alpha_research"
    restart: "no"
